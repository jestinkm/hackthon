<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8e24aa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #6a1b9a;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            margin: 12px 0;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background: #6a1b9a;
            color: white;
        }

        .btn-primary:hover {
            background: #4a148c;
        }

        .btn-danger {
            background: #d32f2f;
            color: white;
        }

        .btn-danger:hover {
            background: #b71c1c;
        }
        @media (max-width: 768px) {
    .container {
        width: 90%;
        padding: 30px;
    }

    h2 {
        font-size: 22px;
    }

    .btn {
        font-size: 14px;
        padding: 12px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    .container {
        width: 95%;
        padding: 25px;
    }

    h2 {
        font-size: 20px;
    }

    .btn {
        font-size: 13px;
        padding: 10px;
    }
}


    </style>
</head>

<body>

    <div class="container">
        <h2>Welcome to Dashboard</h2>
        <a href="fill.html" class="btn btn-primary">➕ Add New Data</a>
        <a href="data.html" class="btn btn-primary">📊 Bar Chart</a>
        <a href="data2.html" class="btn btn-primary">📈 Pie Chart</a>
        <a href="index.html" class="btn btn-primary">logout</a>
    </div>
</body>

</html>

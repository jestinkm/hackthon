<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access Request</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            background-color: #8a2be2; /* Violet background */
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
        }

        input {
            background: rgba(255, 255, 255, 0.8);
        }

        button {
            background: #ff4081;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }

        .back-button {
            background: #03a9f4;
            margin-top: 10px;
        }

        .back-button:hover {
            background: #0288d1;
        }
    </style>
</head>

<body>

    <h1>Admin Access Request</h1>
    <div class="container">
        <form id="adminForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="text" id="purpose" placeholder="Purpose" required>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Apply</button>
        </form>
        <button class="back-button" onclick="goHome()">Back to Home</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBH93OAEuyOf-GJkAZe-6QZfajymlCz2EM",
            authDomain: "hackthon-37459.firebaseapp.com",
            databaseURL: "https://hackthon-37459-default-rtdb.firebaseio.com",
            projectId: "hackthon-37459",
            storageBucket: "hackthon-37459.firebasestorage.app",
            messagingSenderId: "327182533815",
            appId: "1:327182533815:web:11dae37967d609d3e4f932",
            measurementId: "G-0B2XDWFGDS"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        document.getElementById('adminForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const purpose = document.getElementById('purpose').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                await db.collection("adminRequests").add({
                    name,
                    purpose,
                    username,
                    password
                });
                alert("Admin request submitted successfully!");
                document.getElementById("adminForm").reset();
            } catch (error) {
                console.error("Error submitting request:", error);
            }
        });

        function goHome() {
            window.location.href = "index.html"; // Update with the correct homepage link if needed
        }
    </script>

</body>
</html>

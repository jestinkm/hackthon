<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8e24aa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
            color: #4a148c;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #4a148c;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Enter Username"><br>
        <input type="password" id="password" placeholder="Enter Password"><br>
        <button onclick="login()">Login</button>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyBH93OAEuyOf-GJkAZe-6QZfajymlCz2EM",
  authDomain: "hackthon-37459.firebaseapp.com",
  databaseURL: "https://hackthon-37459-default-rtdb.firebaseio.com",
  projectId: "hackthon-37459",
  storageBucket: "hackthon-37459.firebasestorage.app",
  messagingSenderId: "327182533815",
  appId: "1:327182533815:web:11dae37967d609d3e4f932",
  measurementId: "G-0B2XDWFGDS"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
   

    function login() {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    if (username === "" || password === "") {
        alert("Please enter both username and password.");
        return;
    }

    console.log("Checking Firestore for user:", username); // Debugging log

    db.collection("users").doc(username).get()
        .then((doc) => {
            if (doc.exists) {
                console.log("User found in Firestore:", doc.data()); // Debugging log
                let storedPassword = doc.data().password;
                if (storedPassword === password) {
                    console.log("Login successful! Redirecting...");
                    window.location.href = "dashboard.html";
                } else {
                    alert("Incorrect password!");
                }
            } else {
                alert("User does not exist!");
            }
        })
        .catch((error) => {
            console.error("Error fetching user document:", error);
            alert("An error occurred while logging in. Please try again.");
        });
}
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Options</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            /* Align items vertically */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
    background-color: #8e24aa;
            overflow: hidden;
            /* Fallback background color */
        }
        
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Cover the entire viewport */
            z-index: -1;
            /* Place video behind other content */
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            /* Center the links */
        }
        
        a {
            display: block;
            /* Make links stack vertically */
            margin-bottom: 20px;
            /* Space between links */
            padding: 15px 25px;
    background-color: #8e24aa;
            /* Green background */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        a:hover {
            background-color: #8e24aa;
            /* Darker green on hover */
        }
        
        span {
            font-size: 18px;
            /* Larger font size for link text */
        }
    </style>
</head>

<body>
    <div class="container">
        <p><a href="fill.html"><span>Add New Data</span></a></p>
        <p><a href="data.html"><span>bar chart</span></a></p>
        <p><a href="data2.html"><span>pie chart</span></a></p>
    </div>
</body>

</html>

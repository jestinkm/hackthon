<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SheDeserves</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        /* Color Palette */
        :root {
            --primary-color: #8e24aa;
            --secondary-color: #6a1b9a;
            --accent-color: #ff4081;
            --light-color: #f3e5f5;
            --dark-color: #333;
            --white-color: #fff;
            --background-color: #6a1b9a; /* Violet Background */
            --gradient-color: linear-gradient(135deg, #8e24aa, #6a1b9a);
        }

        /* Page Styles */
        body {
            background-color: var(--background-color);
            padding: 20px;
            color: var(--white-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Contact Section */
        .contact-container {
            background: var(--white-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .contact-container h2 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            position: relative;
        }

        .contact-container h2::after {
            content: '';
            width: 80px;
            height: 4px;
            background-color: var(--accent-color);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .contact-container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .contact-container input,
        .contact-container textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            background-color: var(--light-color);
            color: var(--dark-color);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .contact-container input:focus,
        .contact-container textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .contact-container textarea {
            resize: vertical;
            min-height: 120px;
        }

        .contact-container button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            color: var(--white-color);
            cursor: pointer;
            background: var(--gradient-color);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }

        .contact-container button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .home-button {
            background: var(--secondary-color);
            text-align: center;
            display: block;
            font-size: 1rem;
            margin-top: 15px;
            padding: 12px;
            color: var(--white-color);
            border-radius: 8px;
            text-decoration: none;
        }

        .home-button:hover {
            background: var(--accent-color);
        }

        @media (max-width: 768px) {
            .contact-container {
                width: 90%;
            }
        }
        @media (max-width: 768px) {
    .contact-container {
        width: 90%;
        padding: 30px;
    }

    .contact-container h2 {
        font-size: 2rem;
    }

    .contact-container input,
    .contact-container textarea {
        font-size: 0.9rem;
        padding: 10px;
    }

    .contact-container button {
        font-size: 1rem;
        padding: 12px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    .contact-container {
        width: 95%;
        padding: 20px;
    }

    .contact-container h2 {
        font-size: 1.8rem;
    }

    .contact-container input,
    .contact-container textarea {
        font-size: 0.85rem;
        padding: 8px;
    }

    .contact-container button {
        font-size: 0.9rem;
        padding: 10px;
    }

    .home-button {
        font-size: 0.9rem;
        padding: 10px;
    }
}

    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
</head>
<body>
     
    <!-- Contact Us Section -->
    <div class="contact-container">
        <h2>Contact Us</h2>
        <form id="contactForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
        
        <!-- Home Button -->
        <a href="index.html" class="home-button">Home</a>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        // Firebase Config (Replace with your Firebase credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyBH93OAEuyOf-GJkAZe-6QZfajymlCz2EM",
            authDomain: "hackthon-37459.firebaseapp.com",
            databaseURL: "https://hackthon-37459-default-rtdb.firebaseio.com",
            projectId: "hackthon-37459",
            storageBucket: "hackthon-37459.firebasestorage.app",
            messagingSenderId: "327182533815",
            appId: "1:327182533815:web:11dae37967d609d3e4f932",
            measurementId: "G-0B2XDWFGDS"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Form Submission Event Listener
        document.getElementById('contactForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            try {
                await addDoc(collection(db, "contactMessages"), {
                    name: name,
                    email: email,
                    message: message,
                    timestamp: new Date()
                });

                alert("Message Sent Successfully!");
                document.getElementById('contactForm').reset();
            } catch (error) {
                console.error("Error saving message: ", error);
                alert("Failed to send message. Please try again.");
            }
        });
    </script>

</body>
</html>
